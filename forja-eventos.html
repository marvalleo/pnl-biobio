<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos - Forja Libertaria</title>
    <link rel="stylesheet" href="/out.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        :root {
            --pnl-blue: #0f172a;
            --pnl-gold: #fba931;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f8fafc;
            color: var(--pnl-blue);
        }

        .serif {
            font-family: 'Playfair Display', serif;
        }

        .nav-link {
            cursor: pointer;
            position: relative;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            transition: all 0.3s;
        }

        .nav-link:hover {
            color: var(--pnl-gold);
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 3px;
            bottom: -4px;
            left: 0;
            background-color: var(--pnl-gold);
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .calendar-day:hover {
            background-color: #f1f5f9;
        }

        .calendar-day.has-event {
            background-color: #fef3c7;
            color: #d97706;
            border: 2px solid #fba931;
        }

        .calendar-day.selected {
            background-color: #fba931 !important;
            color: #0f172a !important;
            box-shadow: 0 4px 12px rgba(251, 169, 49, 0.3);
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <!-- NAVEGACIÓN -->
    <pnl-navbar type="forja"></pnl-navbar>

    <!-- DASHBOARD DE BIENVENIDA -->
    <section class="max-w-7xl mx-auto px-6 pt-10 w-full">
        <div id="member-dashboard" class="bg-[#0f172a] rounded-[2.5rem] p-8 md:p-10 text-white shadow-xl min-h-[180px]">
            <div class="animate-pulse flex gap-4">
                <div class="h-6 w-48 bg-white/10 rounded"></div>
            </div>
        </div>
    </section>

    <!-- CONTENT -->
    <main class="max-w-7xl mx-auto px-6 py-12 flex-1 w-full grid grid-cols-1 lg:grid-cols-3 gap-12">
        <!-- Listado de Eventos -->
        <div class="lg:col-span-2">
            <div class="mb-10">
                <h1 class="serif text-5xl text-[#0f172a] mb-2">Agenda Regional</h1>
                <p class="text-gray-600 font-bold text-xs uppercase tracking-widest">Próximas Convocatorias y Talleres
                </p>
            </div>

            <div id="events-list" class="space-y-6">
                <!-- Loading State -->
                <div class="animate-pulse space-y-4">
                    <div class="h-40 bg-gray-100 rounded-[2.5rem]"></div>
                    <div class="h-40 bg-gray-100 rounded-[2.5rem]"></div>
                </div>
            </div>
        </div>

        <!-- Sidebar: Calendario y Filtros -->
        <div class="space-y-8">
            <div class="bg-white rounded-[2.5rem] p-8 shadow-xl border border-gray-100 border-t-8 border-[#fba931]">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="font-900 uppercase text-xs tracking-widest text-gray-600" id="current-month-name">Febrero
                        2026</h3>
                    <div class="flex gap-2 text-gray-600">
                        <button class="material-symbols-outlined hover:text-[#fba931]"
                            onclick="changeMonth(-1)">chevron_left</button>
                        <button class="material-symbols-outlined hover:text-[#fba931]"
                            onclick="changeMonth(1)">chevron_right</button>
                    </div>
                </div>

                <div class="grid grid-cols-7 gap-1 text-center mb-2">
                    <span class="text-[8px] font-black uppercase text-gray-500">Lu</span>
                    <span class="text-[8px] font-black uppercase text-gray-500">Ma</span>
                    <span class="text-[8px] font-black uppercase text-gray-500">Mi</span>
                    <span class="text-[8px] font-black uppercase text-gray-500">Ju</span>
                    <span class="text-[8px] font-black uppercase text-gray-500">Vi</span>
                    <span class="text-[8px] font-black uppercase text-gray-500">Sa</span>
                    <span class="text-[8px] font-black uppercase text-gray-500">Do</span>
                </div>

                <div id="calendar-grid" class="grid grid-cols-7 gap-1">
                    <!-- Calendario dinámico -->
                </div>
            </div>

            <div class="bg-blue-50 rounded-[2.5rem] p-8 border border-blue-100">
                <div class="flex items-center gap-3 mb-4">
                    <span class="material-symbols-outlined text-[#fba931]">help</span>
                    <h4 class="font-900 uppercase text-[11px] tracking-widest">Sobre las inscripciones</h4>
                </div>
                <p class="text-[11px] font-bold text-gray-500 leading-relaxed uppercase">Para los eventos presenciales,
                    el cupo es limitado para asegurar la calidad de la sesión. Si no puedes asistir, por favor cancela
                    tu inscripción.</p>
            </div>
        </div>
    </main>

    <pnl-footer></pnl-footer>

    <script src="/assets/vendor/supabase-js.js"></script>
    <script type="module" src="supabase-config.js"></script>
    <script type="module" src="/shared.js"></script>
    <script>
        let events = [];
        let profileId = null;
        let registrations = new Set();
        let currentMonth = new Date();
        currentMonth.setDate(1); // Empezar en el mes actual

        window.addEventListener('DOMContentLoaded', async () => {
            // Esperar a que Supabase se inicialice (máximo 2 segundos)
            let attempts = 0;
            while (!window.isSupabaseInit && attempts < 20) {
                await new Promise(r => setTimeout(r, 100));
                attempts++;
            }

            if (!window.isSupabaseInit) {
                console.error("Supabase no inicializado.");
                return;
            }

            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) { window.location.href = 'forja-login.html'; return; }

            // Usar cache de sesión si existe
            let profile = JSON.parse(sessionStorage.getItem('pnl_profile'));
            if (!profile) {
                const { data } = await supabaseClient.from('profiles').select('id, role').eq('auth_id', user.id).single();
                profile = data;
                if (profile) sessionStorage.setItem('pnl_profile', JSON.stringify(profile));
            }

            if (!profile) return;
            profileId = profile.id;

            await Promise.all([loadEvents(), loadRegistrations()]);
            renderEvents();
            renderCalendar();
            renderDashboard(user.id);
            initNavbar();
        });

        // ─── GAMIFICACIÓN ────────────────────────────────────────────────────────
        // Rangos: umbral mínimo de reputación para alcanzar cada nivel
        const RANKS = [
            { name: 'Iniciado',   min: 0,    max: 99  },
            { name: 'Activista',  min: 100,  max: 249 },
            { name: 'Militante',  min: 250,  max: 499 },
            { name: 'Dirigente',  min: 500,  max: 999 },
            { name: 'Fundador',   min: 1000, max: Infinity }
        ];

        // Definiciones de logros (clave → icono, nombre, descripción)
        const ACHIEVEMENT_DEFS = {
            bienvenido:       { icon: '🎉', name: 'Primer Paso',      desc: 'Ingresaste por primera vez a la Forja' },
            primer_evento:    { icon: '📅', name: 'Comprometido',     desc: 'Te inscribiste en tu primer evento' },
            racha_7:          { icon: '🔥', name: 'En Racha',         desc: '7 días seguidos en la plataforma' },
            racha_30:         { icon: '⚡', name: 'Imparable',        desc: '30 días seguidos en la plataforma' },
            primer_curso:     { icon: '📖', name: 'Aprendiz',         desc: 'Completaste tu primera lección' },
            forjador_bronce:  { icon: '🏅', name: 'Forjador',         desc: 'Completaste un curso completo' },
            primer_diploma:   { icon: '🎓', name: 'Graduado',         desc: 'Descargaste tu primer diploma' },
            nivel_activista:  { icon: '🌟', name: 'Activista',        desc: 'Alcanzaste el rango Activista' },
            nivel_militante:  { icon: '⭐', name: 'Militante',        desc: 'Alcanzaste el rango Militante' },
        };

        function getRankInfo(rep) {
            for (let i = RANKS.length - 1; i >= 0; i--) {
                if (rep >= RANKS[i].min) {
                    const current = RANKS[i];
                    const next = RANKS[i + 1] || null;
                    const ptsInLevel = rep - current.min;
                    const levelRange = next ? (next.min - current.min) : 1;
                    const pct = next ? Math.min(100, Math.round((ptsInLevel / levelRange) * 100)) : 100;
                    const ptsNeeded = next ? (next.min - rep) : 0;
                    return { current: current.name, next: next?.name || null, pct, ptsNeeded };
                }
            }
            return { current: 'Iniciado', next: 'Activista', pct: 0, ptsNeeded: 100 };
        }

        async function updateStreak(profileId) {
            const today = new Date().toISOString().split('T')[0];
            try {
                const { data: p } = await supabaseClient.from('profiles')
                    .select('id, login_streak, last_activity_date')
                    .eq('id', profileId).maybeSingle();
                if (!p) return;

                const last = p.last_activity_date;
                if (last === today) return; // ya registrado hoy

                const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
                const newStreak = (last === yesterday) ? (p.login_streak || 0) + 1 : 1;

                await supabaseClient.from('profiles').update({
                    login_streak: newStreak,
                    last_activity_date: today
                }).eq('id', profileId);

                // Racha logros
                if (newStreak >= 30) await grantAchievement(profileId, 'racha_30');
                else if (newStreak >= 7) await grantAchievement(profileId, 'racha_7');

                return newStreak;
            } catch (_) { return null; }
        }

        async function grantAchievement(profileId, key) {
            try {
                await supabaseClient.from('user_achievements').insert({ profile_id: profileId, achievement_key: key });
            } catch (_) { /* ya existe — UNIQUE constraint lo ignora silenciosamente */ }
        }

        async function loadAchievements(profileId) {
            try {
                const { data } = await supabaseClient.from('user_achievements')
                    .select('achievement_key, earned_at')
                    .eq('profile_id', profileId);
                return new Set((data || []).map(a => a.achievement_key));
            } catch (_) { return new Set(); }
        }

        async function renderDashboard(authId) {
            const el = document.getElementById('member-dashboard');
            if (!el) return;
            const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            // Datos del perfil (incluye streak)
            let p = null;
            try {
                const { data } = await supabaseClient.from('profiles')
                    .select('id, full_name, rank, reputation_score, login_streak, last_activity_date')
                    .eq('auth_id', authId).maybeSingle();
                p = data;
            } catch (_) { }

            const firstName = esc((p?.full_name || 'Militante').split(' ')[0]);
            const rep = p?.reputation_score || 0;
            const rankInfo = getRankInfo(rep);
            const rankName = esc(p?.rank || rankInfo.current);

            // Actualizar racha (async, no bloquea UI)
            let streak = p?.login_streak || 0;
            if (p?.id) {
                const newStreak = await updateStreak(p.id);
                if (newStreak != null) streak = newStreak;

                // Logro de bienvenida (siempre al entrar)
                await grantAchievement(p.id, 'bienvenido');

                // Logros de rango
                if (rep >= 250) await grantAchievement(p.id, 'nivel_militante');
                else if (rep >= 100) await grantAchievement(p.id, 'nivel_activista');
            }

            // Cargar logros para mostrar
            const earned = p?.id ? await loadAchievements(p.id) : new Set();

            // Próximo evento
            const now = Date.now();
            const upcoming = events
                .filter(e => e.event_date && new Date(e.event_date).getTime() >= now)
                .sort((a, b) => new Date(a.event_date) - new Date(b.event_date));
            const next = upcoming[0];
            const nextText = next
                ? `${esc(next.title)} · ${new Date(next.event_date).toLocaleDateString('es-CL', { day: '2-digit', month: 'short' })}`
                : 'Sin eventos próximos';

            const myCount = registrations.size;

            const link = (href, icon, label) => `
                <a href="${href}" class="flex items-center gap-2 bg-white/5 hover:bg-white/10 px-5 py-3 rounded-xl text-[11px] font-black uppercase tracking-widest transition-all">
                    <span class="material-symbols-outlined text-base text-[#fba931]">${icon}</span> ${label}
                </a>`;

            // Barra de progreso de nivel
            const progressBar = rankInfo.next
                ? `<div class="mt-4">
                    <div class="flex justify-between items-center mb-1.5">
                        <span class="text-[10px] font-black uppercase tracking-widest text-white/40">Progreso al siguiente rango</span>
                        <span class="text-[10px] font-black text-[#fba931]">${rankInfo.next} · faltan ${rankInfo.ptsNeeded} pts</span>
                    </div>
                    <div class="w-full bg-white/10 rounded-full h-2 overflow-hidden">
                        <div class="bg-[#fba931] h-full rounded-full transition-all duration-1000 shadow-[0_0_8px_#fba931]"
                             style="width:${rankInfo.pct}%"></div>
                    </div>
                   </div>`
                : `<div class="mt-4">
                    <span class="text-[10px] font-black uppercase text-[#fba931] tracking-widest">🏆 Rango máximo alcanzado</span>
                   </div>`;

            // Logros (los primeros 8, earned primero)
            const allKeys = Object.keys(ACHIEVEMENT_DEFS);
            const sortedKeys = [...allKeys].sort((a, b) => (earned.has(b) ? 1 : 0) - (earned.has(a) ? 1 : 0));
            const achievementsHTML = sortedKeys.slice(0, 8).map(key => {
                const def = ACHIEVEMENT_DEFS[key];
                const isEarned = earned.has(key);
                return `<div title="${def.name}: ${def.desc}"
                             class="flex flex-col items-center gap-1 ${isEarned ? '' : 'opacity-30 grayscale'} transition-all cursor-default select-none"
                             aria-label="${def.name}${isEarned ? ' (ganado)' : ' (pendiente)'}">
                    <div class="w-10 h-10 rounded-full flex items-center justify-center text-xl
                                ${isEarned ? 'bg-[#fba931]/20 border border-[#fba931]/40 shadow-[0_0_12px_rgba(251,169,49,0.3)]' : 'bg-white/5 border border-white/10'}">
                        ${def.icon}
                    </div>
                    <span class="text-[8px] font-black uppercase tracking-wide text-center leading-tight max-w-[52px]">${def.name}</span>
                </div>`;
            }).join('');

            // Racha badge
            const streakBadge = streak >= 2
                ? `<span class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-orange-500/20 border border-orange-500/30 text-orange-400 text-[11px] font-black uppercase tracking-widest">
                    🔥 ${streak} días seguidos
                   </span>`
                : '';

            el.innerHTML = `
                <div class="flex flex-col md:flex-row md:items-start justify-between gap-8">
                    <div class="flex-1 min-w-0">
                        <p class="text-[11px] font-black uppercase tracking-[0.3em] text-[#fba931] mb-2">Tu Espacio Libertario</p>
                        <h2 class="serif text-4xl mb-3">Hola, ${firstName}</h2>
                        <div class="flex items-center gap-3 flex-wrap">
                            <span class="px-3 py-1 rounded-full bg-[#fba931] text-[#0f172a] text-[11px] font-black uppercase tracking-widest">${rankName}</span>
                            <span class="text-xs font-bold text-white/60">${rep} pts de reputación</span>
                            ${streakBadge}
                        </div>
                        ${progressBar}
                    </div>
                    <div class="grid grid-cols-2 gap-4 shrink-0">
                        <div class="bg-white/5 rounded-2xl p-5 border border-white/10 min-w-[150px]">
                            <span class="material-symbols-outlined text-[#fba931]">event_upcoming</span>
                            <p class="text-[11px] font-black uppercase tracking-widest text-white/50 mt-2 mb-1">Próximo evento</p>
                            <p class="text-xs font-bold leading-tight">${nextText}</p>
                        </div>
                        <div class="bg-white/5 rounded-2xl p-5 border border-white/10 min-w-[120px]">
                            <span class="material-symbols-outlined text-[#fba931]">how_to_reg</span>
                            <p class="text-[11px] font-black uppercase tracking-widest text-white/50 mt-2 mb-1">Mis inscripciones</p>
                            <p class="text-3xl font-900">${myCount}</p>
                        </div>
                    </div>
                </div>
                <!-- Logros -->
                <div class="mt-6 pt-5 border-t border-white/10">
                    <p class="text-[10px] font-black uppercase tracking-[0.3em] text-white/30 mb-4">Logros</p>
                    <div class="flex flex-wrap gap-4">${achievementsHTML}</div>
                </div>
                <div class="flex flex-wrap gap-3 mt-6 pt-5 border-t border-white/10">
                    ${link('forja-foros.html', 'forum', 'Foros')}
                    ${link('forja-votaciones.html', 'how_to_vote', 'Votaciones')}
                    ${link('forja-academia.html', 'school', 'Forja Academia')}
                    ${link('perfil.html', 'account_circle', 'Mi Perfil')}
                </div>`;
        }

        async function loadEvents() {
            const { data, error } = await supabaseClient
                .from('regional_events')
                .select('*, regional_event_registrations(count)')
                .order('event_date', { ascending: false });

            if (!error) {
                events = data;
            }
        }

        async function loadRegistrations() {
            const { data } = await supabaseClient
                .from('regional_event_registrations')
                .select('lesson_id:event_id')
                .eq('profile_id', profileId);

            registrations = new Set(data.map(r => r.lesson_id));
        }

        function renderEvents(dateToFilter = null) {
            const list = document.getElementById('events-list');
            let filteredEvents = events;

            if (dateToFilter) {
                // Formatting to YYYY-MM-DD for accurate comparison regardless of timezone shifts
                const tzOffset = dateToFilter.getTimezoneOffset() * 60000;
                const localISOTime = (new Date(dateToFilter.getTime() - tzOffset)).toISOString().split('T')[0];
                filteredEvents = events.filter(e => e.event_date && e.event_date.startsWith(localISOTime));
            }

            if (filteredEvents.length === 0) {
                list.innerHTML = `
                <div class="py-20 text-center border-2 border-dashed rounded-[3rem] border-gray-200">
                    <p class="text-[11px] font-black text-gray-500 uppercase tracking-[0.2em]">No hay eventos para esta selección</p>
                    <button onclick="renderEvents()" class="mt-4 text-[11px] font-black text-[#fba931] uppercase hover:underline">Ver todos los eventos</button>
                </div>`;
                return;
            }

            list.innerHTML = filteredEvents.map(event => {
                const date = new Date(event.event_date);
                const isRegistered = registrations.has(event.id);
                const isOnline = event.delivery_type !== 'in_person';
                const isExternalReg = !isOnline && event.content_url;

                return `
                <div class="bg-white rounded-[2.5rem] p-8 shadow-sm border border-gray-100 flex flex-col md:flex-row gap-8 relative group hover:shadow-xl transition-all border-t-4 ${isOnline ? 'border-[#fba931]' : 'border-[#0f172a]'}">
                    <div class="md:w-56 h-40 bg-gray-100 rounded-3xl overflow-hidden shrink-0 relative">
                        <img loading="lazy" src="https://images.unsplash.com/photo-${isOnline ? '1588196749597-9ff075ee6b5b' : '1540317580384-e5d43616b9aa'}?auto=format&fit=crop&q=80&w=400" 
                             class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-1000">
                        <div class="absolute inset-0 bg-black/20"></div>
                    </div>
                    
                    <div class="flex-1 flex flex-col justify-center">
                        <div class="flex items-center gap-3 mb-2">
                            <span class="text-[8px] font-black uppercase tracking-[0.2em] px-3 py-1 rounded-full ${isOnline ? 'bg-amber-100 text-amber-700' : 'bg-gray-100 text-gray-700'}">
                                ${event.delivery_type === 'live' ? 'En Vivo (Online)' : event.delivery_type === 'recorded' ? 'Taller Grabado' : 'Presencial'}
                            </span>
                            ${isRegistered && !isExternalReg ? '<span class="text-[8px] font-black text-green-500 uppercase tracking-widest flex items-center gap-1"><span class="material-symbols-outlined text-[12px]">check_circle</span> Inscrito</span>' : ''}
                        </div>
                        
                        <h3 class="serif text-2xl text-[#0f172a] mb-2">${event.title}</h3>
                        <p class="text-xs text-gray-600 font-medium mb-4 line-clamp-2">${event.description || 'Sin descripción detallada.'}</p>
                        
                        <div class="flex flex-wrap items-center gap-6 mb-6">
                            <div class="flex items-center gap-2 text-gray-600">
                                <span class="material-symbols-outlined text-xs text-[#fba931]">calendar_today</span>
                                <span class="text-[11px] font-black uppercase tracking-wider">${date.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' })} — ${date.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })} hrs</span>
                            </div>
                            <div class="flex items-center gap-2 text-gray-600">
                                <span class="material-symbols-outlined text-xs text-[#fba931]">location_on</span>
                                <span class="text-[11px] font-black uppercase tracking-wider">${event.location || 'Por definir'}</span>
                            </div>
                            <div class="flex items-center gap-2 text-gray-600">
                                <span class="material-symbols-outlined text-xs text-[#fba931]">group</span>
                                <span class="text-[11px] font-black uppercase tracking-wider">
                                    ${event.max_capacity > 0 ? `Cupos: ${(event.regional_event_registrations?.[0]?.count || 0)} / ${event.max_capacity}` : 'Ilimitado'}
                                </span>
                            </div>
                        </div>

                        <div class="flex items-center gap-4">
                            <button onclick="${isExternalReg ? `window.openVideoModal('${event.content_url}')` : `handleRegistration('${event.id}', ${isRegistered}, this)`}" 
                                    class="${isRegistered && !isExternalReg ? 'bg-gray-100 text-gray-600' : isOnline ? 'bg-[#fba931] text-[#0f172a]' : 'bg-[#0f172a] text-white'} px-8 py-3 rounded-xl font-900 text-[11px] uppercase tracking-widest hover:brightness-110 transition-all shadow-lg active:scale-95">
                                ${isExternalReg ? 'Formulario de Inscripción' : isRegistered ? 'Cancelar Inscripción' : 'Inscribirse Ahora'}
                            </button>
                            ${isRegistered && !isExternalReg && event.content_url ? `<button onclick="window.openVideoModal('${event.content_url}')" class="text-[11px] font-black text-[#fba931] uppercase hover:underline">Ir a la sesión</button>` : ''}
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        async function handleRegistration(lessonId, isRegistered, btnElement) {
            if (btnElement) window.setButtonLoading(btnElement, true);

            try {
                if (isRegistered) {
                    if (!confirm('¿Deseas cancelar tu inscripción a este evento?')) {
                        if (btnElement) window.setButtonLoading(btnElement, false);
                        return;
                    }
                    const { error } = await supabaseClient.from('regional_event_registrations').delete().eq('profile_id', profileId).eq('event_id', lessonId);
                    if (error) throw error;
                    registrations.delete(lessonId);
                    showToast('Inscripción cancelada', 'info');
                    window.logSystemEvent('registration', 'info', `Cancelación de inscripción al evento ID: ${lessonId}`);
                } else {
                    // Validar si tenemos profileId
                    if (!profileId) {
                        throw new Error("No se detectó el perfil del usuario. Por favor, recarga la página.");
                    }

                    const { data: currentLesson, error: lessonError } = await supabaseClient.from('regional_events').select('title, max_capacity').eq('id', lessonId).maybeSingle();
                    if (lessonError) throw lessonError;
                    if (!currentLesson) throw new Error("El evento no fue encontrado.");

                    const { count, error: countError } = await supabaseClient.from('regional_event_registrations').select('*', { count: 'exact', head: true }).eq('event_id', lessonId);
                    if (countError) throw countError;

                    if (currentLesson.max_capacity > 0 && count >= currentLesson.max_capacity) {
                        showToast('Lo sentimos, este evento ya no tiene cupos disponibles.', 'warning');
                        if (btnElement) window.setButtonLoading(btnElement, false);
                        return;
                    }

                    const { error } = await supabaseClient.from('regional_event_registrations').insert({ profile_id: profileId, event_id: lessonId });
                    
                    if (error) {
                        // Manejo específico de duplicados (Ya inscrito)
                        if (error.code === '23505') {
                            showToast('Ya te encuentras inscrito en este evento.', 'info');
                            registrations.add(lessonId);
                            renderEvents();
                            return;
                        }
                        throw error;
                    };

                    registrations.add(lessonId);
                    showToast('¡Inscripción exitosa! Te esperamos.', 'success');
                    window.logSystemEvent('registration', 'info', `Inscripción exitosa al evento: ${currentLesson.title}`);
                    // Logro: primer evento
                    await grantAchievement(profileId, 'primer_evento');
                }
                await loadEvents();
                renderEvents();
                renderCalendar();
            } catch (err) {
                console.error(err);
                const errorMsg = err.message || 'Error desconocido';
                showToast(`Error: ${errorMsg}`, 'error');
                
                // Registrar el error en el sistema de logs
                if (window.logError) {
                    window.logError(`Fallo en inscripción (Mobile): ${errorMsg}`, { event_id: lessonId, is_registered_attempt: isRegistered }, err);
                }
            } finally {
                if (btnElement) window.setButtonLoading(btnElement, false);
            }
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const monthLabel = document.getElementById('current-month-name');
            grid.innerHTML = '';
            const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

            monthLabel.textContent = `${monthNames[currentMonth.getMonth()]} ${currentMonth.getFullYear()}`;

            const year = currentMonth.getFullYear();
            const month = currentMonth.getMonth();
            const firstDay = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            let startOffset = firstDay === 0 ? 6 : firstDay - 1;

            for (let i = 0; i < startOffset; i++) grid.innerHTML += '<span></span>';
            for (let day = 1; day <= totalDays; day++) {
                const date = new Date(year, month, day);
                const tzOffsetStr = new Date(date.getTime() - (date.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
                const hasEvent = events.some(e => {
                    if (!e.event_date) return false;
                    const eventDateObj = new Date(e.event_date);
                    const eventISOLocal = new Date(eventDateObj.getTime() - (eventDateObj.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
                    return eventISOLocal === tzOffsetStr;
                });
                grid.innerHTML += `<div onclick="filterByDate(${year}, ${month}, ${day})" class="calendar-day ${hasEvent ? 'has-event' : ''}">${day}</div>`;
            }
        }

        function filterByDate(y, m, d) {
            const selectedDate = new Date(y, m, d);
            document.querySelectorAll('.calendar-day').forEach(el => {
                el.classList.remove('selected');
                if (parseInt(el.textContent) === d) el.classList.add('selected');
            });
            renderEvents(selectedDate);
        }

        function changeMonth(delta) {
            currentMonth.setMonth(currentMonth.getMonth() + delta);
            renderCalendar();
            renderEvents();
        }
    </script>
